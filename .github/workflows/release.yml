name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.3.0) - Leave empty to create a new tag from main"
        required: false
        type: string
      create_tag:
        description: "Create the tag if it does not exist"
        required: false
        type: boolean
        default: false
      release_type:
        description: "Type of release (for new tags only)"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Least-privilege default: every job below either declares its own
# ``permissions`` (which replaces this wholesale) or needs nothing beyond
# reading the checkout. Without a top-level block a job inherits the
# repository default, which is a setting that can be widened out from under
# this file (Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  validate-and-prepare:
    name: Validate and Prepare Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # Pushes a new tag when create_tag input is true
    outputs:
      tag_name: ${{ steps.prepare.outputs.tag_name }}
      should_create_tag: ${{ steps.prepare.outputs.should_create_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate and prepare release
        id: prepare
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Use provided tag
            TAG="$INPUT_TAG"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
              echo "Error: Invalid tag format. Expected format: v1.2.3"
              exit 1
            fi
          else
            # Generate new tag based on release type
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: $LATEST_TAG"

            # Extract version numbers
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Increment based on release type
            case "$INPUT_RELEASE_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

          # Check if tag exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_create_tag=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "should_create_tag=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG will be created"
          fi

      - name: Create tag if needed
        if: steps.prepare.outputs.should_create_tag == 'true' && github.event.inputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.prepare.outputs.tag_name }}" -m "Release ${{ steps.prepare.outputs.tag_name }}"
          git push origin "${{ steps.prepare.outputs.tag_name }}"
          echo "Created and pushed tag ${{ steps.prepare.outputs.tag_name }}"

      - name: Fail if tag doesn't exist and creation not requested
        if: steps.prepare.outputs.should_create_tag == 'true' && github.event.inputs.create_tag != 'true'
        run: |
          echo "Error: Tag ${{ steps.prepare.outputs.tag_name }} does not exist and create_tag is false"
          echo "Either set create_tag to true or create the tag manually first"
          exit 1

  test:
    name: Test before release
    runs-on: ubuntu-latest
    needs: [validate-and-prepare]
    if: always() && (needs.validate-and-prepare.result == 'success' || needs.validate-and-prepare.result == 'skipped')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # ``--locked`` asserts uv.lock is already in sync with pyproject.toml
      # rather than silently re-resolving. A release must build from the exact
      # dependency set that CI audited; the release-please ``sync-uv-lock`` job
      # keeps the lockfile current, so a mismatch here means something is wrong
      # and failing loudly is the point.
      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          make check

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, test]
    if: always() && needs.test.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: |
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      # The .mcpb bundle (Smithery listing + Claude Desktop one-click extension)
      # is built into a SEPARATE directory/artifact, never dist/. The
      # publish-pypi job uploads everything in the `dist` artifact to PyPI, and a
      # .mcpb is not a valid distribution — keeping it out of `dist` avoids a
      # failed/garbage PyPI upload. create-release merges it back in for the
      # GitHub release only. `uv run` syncs the project venv (installs openzim_mcp
      # + libzim) before running, which build_mcpb.py needs to spawn the server
      # and capture live tool schemas.
      - name: Build .mcpb bundle
        run: uv run --locked python scripts/build_mcpb.py --output dist-mcpb

      - name: Upload .mcpb bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcpb
          path: dist-mcpb/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build]
    # Only run PyPI deployment when triggered by tag push or when workflow_dispatch provides a valid tag
    if: always() && needs.build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag)))
    environment:
      name: pypi
      url: https://pypi.org/p/openzim-mcp
    permissions:
      id-token: write # Required for trusted publishing to PyPI
    steps:
      - name: Validate deployment context
        # Everything below arrives through env, never through ``${{ }}`` inside
        # the script. Branch, tag and ref names are attacker-chooseable strings:
        # interpolated into the shell source they are executed, while as env
        # vars they are only ever data. TAG especially — it is a
        # workflow_dispatch input, and the regex check under it cannot help
        # when the assignment itself is the injection point.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          TAG: ${{ needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $REF"
          echo "Head branch: $HEAD_BRANCH"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Tag input: $TAG"
            # Ensure the tag input is provided and starts with 'v'
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
              echo "Error: Invalid tag format. Expected format: v1.2.3"
              exit 1
            fi
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  # The official MCP Registry entry (io.github.cameronrye/openzim-mcp) used to
  # be advanced by hand with `mcp-publisher login github` (device-code OAuth),
  # so it silently fell five releases behind PyPI. Publish from here instead:
  # the GitHub OIDC token proves ownership of the io.github.cameronrye/*
  # namespace, and server.json is already version-locked by release-please.
  # This job is deliberately NOT a dependency of create-release — a registry
  # outage must never block or empty a GitHub release.
  publish-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, publish-pypi]
    if: always() && needs.publish-pypi.result == 'success'
    permissions:
      id-token: write # GitHub OIDC login to the registry (io.github.* namespace)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag) || github.ref }}

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz
          test -x ./mcp-publisher
          ./mcp-publisher --version

      # The registry verifies the `mcp-name` marker against the LIVE PyPI
      # description of packages[0].version, and PyPI can take a minute to
      # serve a freshly uploaded release. Assert the version lockstep on the
      # manual-tag path too, then wait for PyPI rather than racing it.
      - name: Wait for PyPI to serve the released version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          SERVERJSON_VERSION=$(jq -r '.packages[0].version' server.json)
          if [ "$SERVERJSON_VERSION" != "$VERSION" ]; then
            echo "::error::server.json packages[0].version ($SERVERJSON_VERSION) != release $VERSION"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --proto '=https' --tlsv1.2 -fsS "https://pypi.org/pypi/openzim-mcp/${VERSION}/json" >/dev/null; then
              echo "PyPI serves openzim-mcp ${VERSION}"
              exit 0
            fi
            echo "PyPI does not serve ${VERSION} yet (attempt ${attempt}/30)"
            sleep 10
          done
          echo "::error::openzim-mcp ${VERSION} never appeared on PyPI"
          exit 1

      # Skipped when the registry already serves this version, so a re-dispatch
      # of an old tag (backfilling the registry) does not re-publish a version
      # that is already live. The verification step below still runs, so a
      # skipped publish is proved rather than assumed.
      - name: Publish server.json
        run: |
          set -euo pipefail
          SERVER_NAME=$(jq -r '.name' server.json)
          VERSION=$(jq -r '.version' server.json)
          if curl --proto '=https' --tlsv1.2 -fsS \
            "https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER_NAME}&version=${VERSION}" \
            | jq -e --arg n "$SERVER_NAME" --arg v "$VERSION" \
              'any(.servers[]; .server.name == $n and .server.version == $v)' >/dev/null; then
            echo "Registry already serves ${SERVER_NAME} ${VERSION} — nothing to publish"
            exit 0
          fi
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # `mcp-publisher status` is NOT a post-publish check — it MUTATES a
      # version's lifecycle state and exits 1 without `--status`, so using it
      # here reddened the job on every release. Read the entry back from the
      # registry API instead: that search endpoint is what consumers (and
      # docs/distribution.md) look at, so a green job now means the release is
      # really live rather than merely uploaded.
      - name: Verify the registry serves the published version
        run: |
          set -euo pipefail
          SERVER_NAME=$(jq -r '.name' server.json)
          VERSION=$(jq -r '.version' server.json)
          for attempt in $(seq 1 12); do
            if curl --proto '=https' --tlsv1.2 -fsS \
              "https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER_NAME}&version=${VERSION}" \
              | jq -e --arg n "$SERVER_NAME" --arg v "$VERSION" \
                'any(.servers[]; .server.name == $n and .server.version == $v)' >/dev/null; then
              echo "Registry serves ${SERVER_NAME} ${VERSION}"
              exit 0
            fi
            echo "Registry does not serve ${VERSION} yet (attempt ${attempt}/12)"
            sleep 10
          done
          echo "::error::${SERVER_NAME} ${VERSION} never appeared in the MCP Registry"
          exit 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-and-prepare, build, publish-pypi]
    if: always() && needs.publish-pypi.result == 'success'
    permissions:
      contents: write # Creates GitHub release and uploads release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag) || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      # Merge the .mcpb bundle (+ its .sha256) into dist/ so the existing
      # dist/* upload paths below attach it to the GitHub release. This artifact
      # is intentionally kept out of the PyPI publish (see the build job).
      - name: Download .mcpb bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpb
          path: dist/

      - name: Determine tag name
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ needs.validate-and-prepare.outputs.tag_name || github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$DISPATCH_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag name: $TAG_NAME"

      - name: Check if release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          echo "Checking if release exists for tag: $TAG_NAME"

          if gh release view "$TAG_NAME" --json tagName >/dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Release already exists for $TAG_NAME (created by release-please)"
            # A release that is already PUBLISHED *and* already carries assets is
            # finished. This run is then a re-dispatch of an old tag — backfilling
            # the MCP Registry, say — not the tail of a real release. Its assets
            # rebuild from the same source but are not byte-identical (wheels
            # embed a build timestamp), so re-uploading them with --clobber would
            # change published checksums for no reason. A draft, or a published
            # release with no assets, still needs populating and is untouched by
            # this branch.
            is_draft=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)
            asset_count=$(gh release view "$TAG_NAME" --json assets --jq '.assets | length')
            if [ "$is_draft" = "false" ] && [ "$asset_count" -gt 0 ]; then
              echo "release_is_complete=true" >> $GITHUB_OUTPUT
              echo "ℹ️  $TAG_NAME is published with $asset_count assets — leaving them as they are"
            else
              echo "release_is_complete=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "release_is_complete=false" >> $GITHUB_OUTPUT
            echo "📝 Release does not exist for $TAG_NAME, will create new release"
          fi

      - name: Extract release notes
        id: extract-notes
        run: |
          # Extract version from tag
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          VERSION=${TAG_NAME#v}  # Remove 'v' prefix if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Extract release notes from CHANGELOG.md
          python -c "
          import re
          import sys

          version = '$VERSION'
          print(f'Extracting release notes for version: {version}')

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          # Try multiple patterns to find the version section
          patterns = [
              # Pattern 1: [0.3.3] format
              r'## \[' + re.escape(version) + r'\].*?\n(.*?)(?=\n## \[|\n# |\Z)',
              # Pattern 2: v0.3.3 format
              r'## \[v' + re.escape(version) + r'\].*?\n(.*?)(?=\n## \[|\n# |\Z)',
              # Pattern 3: Without brackets
              r'## ' + re.escape(version) + r'.*?\n(.*?)(?=\n## |\n# |\Z)',
              # Pattern 4: With v prefix
              r'## v' + re.escape(version) + r'.*?\n(.*?)(?=\n## |\n# |\Z)'
          ]

          notes = None
          for pattern in patterns:
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  print(f'Found release notes using pattern: {pattern[:50]}...')
                  break

          if notes and len(notes) > 10:  # Ensure we have substantial content
              with open('release_notes.md', 'w') as f:
                  f.write(notes)
              print(f'Release notes extracted successfully ({len(notes)} characters)')
          else:
              fallback_notes = f'## Release {version}\n\nThis release includes various improvements and bug fixes. See the full changelog for details.'
              with open('release_notes.md', 'w') as f:
                  f.write(fallback_notes)
              print('Using fallback release notes')
          " VERSION="$VERSION"

      - name: Upload assets to existing release
        if: steps.check-release.outputs.release_exists == 'true' && steps.check-release.outputs.release_is_complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          echo "📦 Uploading build artifacts to existing release: $TAG_NAME"

          # Upload each file in dist/. A swallowed upload failure here is
          # unrecoverable: under immutable releases the "Publish draft release"
          # step below locks the asset list, so a warning-and-continue produces a
          # permanently asset-less published release with a green pipeline (the
          # rc0/rc1 empty-Releases failure mode). Fail the job instead.
          upload_count=0
          for file in dist/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading: $filename"
              # Use --clobber to overwrite if asset already exists.
              gh release upload "$TAG_NAME" "$file" --clobber
              upload_count=$((upload_count + 1))
            fi
          done

          if [ "$upload_count" -eq 0 ]; then
            echo "::error::No artifacts found in dist/ to upload to $TAG_NAME"
            exit 1
          fi

          echo "✅ Uploaded $upload_count asset(s) to release $TAG_NAME"

      - name: Create new release (draft)
        # Manual `git tag` push path: no release-please draft shell exists,
        # so this step creates one. On repos with immutable releases enabled,
        # assets can only be uploaded WHILE the release is a draft — publishing
        # locks the asset list. softprops/action-gh-release uploads the dist
        # artifacts as part of the draft creation in this branch; the
        # "Publish draft release" step below then flips draft -> published.
        # rc0 and rc1 both shipped with empty Releases pages because this
        # step used to set draft: false (single-shot create+publish), which
        # failed on the asset-upload step under immutable releases.
        if: steps.check-release.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release v${{ steps.extract-notes.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/*
          draft: true
          # Use the resolved tag name (works for workflow_dispatch where
          # github.ref is the source branch, not the release tag).
          prerelease: ${{ contains(steps.tag.outputs.tag_name, 'alpha') || contains(steps.tag.outputs.tag_name, 'beta') || contains(steps.tag.outputs.tag_name, 'rc') }}

      - name: Publish draft release
        # This step is the ONLY thing that makes a release public, on every
        # path. Both converge here as a draft carrying its assets:
        #   - release-please path: release-please created the draft shell
        #     (release-please-config.json `draft: true`) and "Upload assets to
        #     existing release" above populated it.
        #   - manual-tag-push path: "Create new release (draft)" above created
        #     a fresh draft with assets.
        # The order (create-draft → upload-assets → publish) is load-bearing
        # twice over: it is what keeps a half-finished release invisible, and
        # on repos with immutable releases enabled it is the only order that
        # can attach assets at all — publishing locks the asset list.
        #
        # Failing loudly here matters more than it used to. Publication is now
        # this step's job alone, so a silently skipped publish leaves the
        # release stranded as a draft: `set -euo pipefail` plus reading isDraft
        # into a variable (rather than piping it into `grep -q`, which swallows
        # a `gh` failure into the "already published" branch) turns that into a
        # red job instead of a release nobody can see.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"

          is_draft=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)
          if [ "$is_draft" != "true" ]; then
            # Already published — a re-dispatch of a finished tag, or someone
            # published it by hand. Nothing to do either way.
            echo "ℹ️  Release $TAG_NAME is already published — nothing to do"
            exit 0
          fi

          # Never publish an empty release. Every job that produces assets has
          # to have succeeded for this step to run, so zero assets here means
          # something upstream produced nothing and stayed green — exactly the
          # v3.3.0 failure shape (published, tagged, empty). Leaving it as a
          # draft keeps it invisible and re-dispatchable.
          asset_count=$(gh release view "$TAG_NAME" --json assets --jq '.assets | length')
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::Refusing to publish $TAG_NAME with no assets — leaving it as a draft"
            exit 1
          fi

          echo "🚀 Publishing draft release: $TAG_NAME ($asset_count asset(s))"
          gh release edit "$TAG_NAME" --draft=false
          echo "✅ Release $TAG_NAME published"
