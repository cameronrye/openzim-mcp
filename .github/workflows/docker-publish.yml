name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g., v1.0.0)"
        required: true
        type: string

# Least-privilege default: every job below either declares its own
# ``permissions`` (which replaces this wholesale) or needs nothing beyond
# reading the checkout. Without a top-level block a job inherits the
# repository default, which is a setting that can be widened out from under
# this file (Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  # Build once with the classic (non-BuildKit) builder. The publish job below
  # goes through buildx, which is always BuildKit — so BuildKit-only Dockerfile
  # syntax passes CI here while failing on registry builders that don't use it.
  # That blind spot shipped a broken image to Glama once already: `COPY --chmod`
  # is BuildKit-only and died with "the --chmod option requires BuildKit" (#343).
  # This job is the regression guard, and it is the whole point of not reusing
  # buildx for it.
  classic-builder:
    name: Build without BuildKit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No setup-buildx-action on purpose: DOCKER_BUILDKIT=0 selects the
      # classic builder, which rejects BuildKit-only flags the way a
      # registry builder such as Kaniko or plain `docker build` would.
      - name: Build with the classic builder
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build -t openzim-mcp:classic-builder-check .

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' so the image tag is X.Y.Z, not vX.Y.Z
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push (on tag or dispatch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openzim-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/openzim-mcp:latest

      - name: Build only (on PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
