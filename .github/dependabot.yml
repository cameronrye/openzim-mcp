# Dependabot configuration for OpenZIM MCP
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    assignees:
      - "cameronrye"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    ignore:
      # mcp 2.0.0 deleted the mcp.server.fastmcp package tree (renamed to
      # mcp.server.mcpserver, FastMCP -> MCPServer). server.py, mcp_envelope.py
      # and tools/resource_tools.py import the old path at runtime, so widening
      # the bound past <2.0 publishes a wheel that fails at `import openzim_mcp`
      # — and CI can't catch it, because the lockfile keeps resolving 1.x.
      # Drop this once the rename port lands with an mcp-version CI axis.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    # Group related updates together
    groups:
      # Group all patch updates together
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Group development dependencies
      dev-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "flake8*"
          - "mypy*"
          - "isort"
          - "bandit*"
          - "safety"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"
      # Group core dependencies for better management
      core-dependencies:
        patterns:
          - "libzim"
          - "mcp*"
          - "pydantic*"
          - "beautifulsoup4"
          - "html2text"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    assignees:
      - "cameronrye"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
