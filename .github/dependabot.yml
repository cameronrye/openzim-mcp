# Dependabot configuration for OpenZIM MCP
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    # Lockfile-only: Dependabot may move resolved versions inside uv.lock but
    # must never edit a constraint in pyproject.toml. Two reasons.
    #
    # It cannot produce a working PR when it widens one. uv records each
    # requirement's specifier inside uv.lock, so editing a bound in
    # pyproject.toml desyncs the lockfile — and every job installs with
    # `--locked`, which refuses the drift. #383 (widening the mypy cap) died
    # that way in all ten jobs, before a single test ran.
    #
    # And a widened cap is not the upgrade it looks like. `uv lock` keeps the
    # already-resolved version, so the PR advertises a new ceiling while CI
    # goes on testing the old floor — green, and proving nothing. Every capped
    # dependency here (libzim, mcp, pydantic, beautifulsoup4, mypy, ...) is
    # capped on purpose; crossing one is a human decision that needs its own
    # PR and its own evidence.
    versioning-strategy: lockfile-only
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    assignees:
      - "cameronrye"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # No `ignore` entry for mcp. The one that used to live here blocked
    # `version-update:semver-major` because the 1.x -> 2.0 rename (fastmcp ->
    # mcpserver) would have broken `import openzim_mcp`. That port landed in
    # v3.0.0, and under `versioning-strategy: lockfile-only` the rule could
    # not fire anyway: Dependabot resolves inside pyproject's specifier, and
    # `mcp[cli]>=2.1.0,<2.2` admits no other major — nor any other minor. What
    # it *does* admit is a 2.1 patch, which is precisely the update this
    # ecosystem should propose, because CI runs the full suite against the
    # locked wheel. Crossing the cap stays a hand-audited PR (see the comment
    # on the requirement itself); an unreachable rule here only made the file
    # look like it was doing that work.
    # Group related updates together
    groups:
      # Group all patch updates together
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Group development dependencies
      dev-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "flake8*"
          - "mypy*"
          - "isort"
          - "bandit*"
          - "safety"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"
      # Group core dependencies for better management
      core-dependencies:
        patterns:
          - "libzim"
          - "mcp*"
          - "pydantic*"
          - "beautifulsoup4"
          - "html2text"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    assignees:
      - "cameronrye"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images. The Dockerfile pins python:3.13-slim and the uv binary
  # image by digest (Scorecard Pinned-Dependencies), which freezes them until
  # something advances the digest — without this ecosystem a pinned base image
  # quietly stops receiving upstream security patches.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    assignees:
      - "cameronrye"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "ci"
      include: "scope"
    ignore:
      # Digest and patch refreshes only. The point of this ecosystem is to keep
      # a digest-pinned base image receiving upstream security patches — not to
      # move the runtime interpreter. The image must track the Python this
      # project actually tests (the CI matrix is 3.12/3.13 and the classifiers
      # say the same); a minor bump here would ship a container running on an
      # interpreter no test ever exercised. Raise the Python version by editing
      # the Dockerfile alongside the CI matrix and classifiers, not from here.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Same reasoning for the uv binary image: the tag is deliberate.
      - dependency-name: "ghcr.io/astral-sh/uv"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # The documentation site (website/package.json + package-lock.json). Astro,
  # Vite and Pagefind ship the site's entire build toolchain and were the one
  # dependency surface nothing watched — the Python tree, the actions and the
  # base image each had an ecosystem here, and ~220 lockfile lines of JavaScript
  # did not.
  #
  # ``ci``, not ``deps``: ``deps`` is ``"hidden": false`` in
  # release-please-config.json, so a lone dependency bump to a static site would
  # cut a patch release of the Python package and publish a wheel to PyPI whose
  # only change is a devDependency the wheel does not contain. ``ci`` is hidden,
  # which is what a website-only change should be. (The pip ecosystem above
  # keeps ``deps`` on purpose — those bumps do ship inside the wheel.)
  #
  # These PRs are gated: website-ci.yml triggers on ``website/**``, so every one
  # runs ``npm ci --ignore-scripts``, ``astro check``, the Pagefind-inclusive
  # build, and both link passes before it can merge.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    assignees:
      - "cameronrye"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # One PR per week for the routine movement. Astro, its integrations and
      # Vite advance together; splitting them produces PRs that each fail until
      # the others land.
      website-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The ``overrides`` block in website/package.json pins esbuild and yaml
      # above the versions Astro's tree resolves, to clear advisories in
      # transitive dependencies. Dependabot cannot advance an override — it
      # edits ``dependencies``/``devDependencies`` — so a PR naming either of
      # these is a PR that changes nothing while looking like it did. Raising
      # the floor is a hand edit to the overrides block.
      - dependency-name: "esbuild"
      - dependency-name: "yaml"
